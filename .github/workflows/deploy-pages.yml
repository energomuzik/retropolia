# Автопубликация RETROPOLIA на GitHub Pages.
#
# Один раз включить:
#   Settings → Pages → Build and deployment → Source: выбрать «GitHub Actions».
#
# Дальше каждый `git push` в ветку main автоматически собирает игру
# и публикует её на https://ВАШ_ЛОГИН.github.io/ИМЯ_РЕПОЗИТОРИЯ
# (запустить вручную можно: вкладка Actions → deploy-pages → Run workflow).
name: deploy-pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # относительные пути ассетов — обязательны для GitHub Pages (сайт лежит в подкаталоге)
      - run: npm run build -- --base=./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
